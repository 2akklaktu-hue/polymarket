# Ежечасный прогон: снимок рынка + поиск дешёвых исходов с подтверждением.
#
# Два скрипта за один прогон:
#   20_snapshot.py  — пишет снимок цен и оборота (копит историю, которой нет
#                     ни в одном публичном источнике)
#   22_longshots.py — ищет исходы по 3-15 центов, про которые новости, другие
#                     площадки или крупные игроки говорят, что шанс выше цены.
#                     Сильный и средний сигнал шлёт сразу, как и поправку
#                     к нему (усилился, снят); раз в сутки — сводку до трёх
#                     действующих сигналов (нет таких — одна строка).
#
# Раз в час прогон идёт не по расписанию ниже, а по будильнику — заданию next
# в конце этого файла.
#
# Прежний разбор скачков (21_pulse.py) из расписания убран: он присылал уже
# выросшие рынки с выводом, который следовал из самой цены. Запустить его
# вручную по-прежнему можно: python scripts/21_pulse.py --dry
#
# Бесплатно только для ПУБЛИЧНОГО репозитория: приватному дают 2000 минут
# в месяц, а ежечасный прогон съест их за две-три недели.
#
# Настройка: Settings -> Secrets and variables -> Actions
#   вкладка Secrets:
#     TELEGRAM_BOT_TOKEN  — токен от @BotFather
#     TELEGRAM_CHAT_ID    — печатает scripts/setup_telegram.py
#     OPENROUTER_API_KEY  — ключ openrouter.ai: новости оценивает бесплатная
#                           модель (50 запросов в сутки без оплаты)
#     ANTHROPIC_API_KEY   — ключ Claude, платно; если задан, используется он
#     Оба ключа необязательны: без них работают только площадки и игроки,
#     а новости прикладываются заголовками без оценки.
#   вкладка Variables (необязательно):
#     PM_OR_MODELS        — бесплатные модели OpenRouter через запятую, по
#                           порядку попыток; по умолчанию список из pmlib/judge.py
#     PM_AI_MODEL         — модель Claude, по умолчанию claude-opus-5-5
#     PM_AI_PER_DAY       — потолок оценок ИИ в сутки: по умолчанию 16 для
#                           OpenRouter и 6 для Claude
#     PM_DIGEST_HOUR_UTC  — с какого часа (UTC) слать суточную сводку, по умолчанию 9
# И один раз для будильника: Settings -> Environments -> wait-55-min
#   -> Wait timer: 55 -> Save protection rules. Без этого прогоны идут только
#   по расписанию, то есть 3-4 раза в сутки.

name: pulse

on:
  schedule:
    # СТРАХОВКА, а не основной запуск. Бесплатный планировщик GitHub это
    # расписание не исполняет: с 14 по 22 ноября 2026 вместо 24 прогонов
    # в сутки состоялось от 2 до 5. Час держит задание next ниже: оно
    # запускает этот workflow через 55 минут после каждого прогона.
    # Расписание нужно, чтобы завести цепочку заново, если она оборвётся.
    # Минута 7, а не 0: на круглых минутах планировщик перегружен сильнее всего.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Пробный прогон без отправки"
        type: boolean
        default: false
      digest:
        description: "Прислать сводку сейчас, не дожидаясь её часа"
        type: boolean
        default: false

# Права выдаются каждому заданию отдельно, ниже. На уровне файла — никаких.
permissions: {}

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # нужно, чтобы коммитить накопленные снимки
    # Ограничение на ЗАДАНИИ, а не на всём workflow: иначе прогон, который
    # 55 минут ждёт будильника, держал бы очередь, и прогоны по расписанию
    # и ручные стояли бы за ним.
    concurrency:
      group: pulse        # снимки дописываются в один файл, параллельно нельзя
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Состояние между запусками: last.json нужен, чтобы в снимок попадали
      # только изменения; longshots_state.json хранит собранные подтверждения,
      # оценки ИИ и присланные сигналы, за которыми бот следит, — без него бот
      # каждый час заново тратил бы запросы и присылал один и тот же сигнал.
      - name: Восстановить состояние
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/last.json
            data/out/longshots_state.json
          key: pulse-${{ github.run_id }}
          restore-keys: pulse-

      - name: Снимок рынка
        run: python scripts/20_snapshot.py

      - name: Дешёвые исходы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PM_OR_MODELS: ${{ vars.PM_OR_MODELS }}
          PM_AI_MODEL: ${{ vars.PM_AI_MODEL }}
          PM_AI_PER_DAY: ${{ vars.PM_AI_PER_DAY }}
          PM_DIGEST_HOUR_UTC: ${{ vars.PM_DIGEST_HOUR_UTC }}
        run: |
          args=""
          if [ "${{ inputs.dry }}" = "true" ]; then args="$args --dry"; fi
          if [ "${{ inputs.digest }}" = "true" ]; then args="$args --digest"; fi
          # Отчёт прогона дублируется в файл и уезжает в репозиторий вместе со
          # снимками: логи Actions скачиваются не из всех сетей, а так видно,
          # что ответил ИИ и почему. В файл идёт ТОЛЬКО stdout. Трассировки
          # ошибок (stderr) остаются в логе Actions: в них бывает адрес запроса
          # к Telegram с токеном, а репозиторий открытый.
          set -o pipefail
          python scripts/22_longshots.py $args | tee data/live/last_run.log

      # Снимки нужны надолго, а кэш Actions вытесняется через неделю без
      # обращений — поэтому история уезжает в сам репозиторий.
      - name: Сохранить снимки в репозиторий
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # папки может не быть, если репозиторий залит без снимков:
          # git add по несуществующему пути завершается ошибкой
          mkdir -p data/live
          git add -A data/live
          if git diff --cached --quiet; then
            echo "новых снимков нет"
            exit 0
          fi
          git commit -m "снимки рынка $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Снимки дописываются в общие файлы, и слить две версии git не может:
          # snap-*.csv.gz бинарный. Если пока мы работали, в origin появился
          # более свежий снимок, свой пропускаем — один снимок из сотни ничего
          # не меняет, а падение шага ломает всю цепочку. Та же ситуация у
          # Re-run старого прогона: он работает со СТАРЫМ срезом репозитория и
          # конфликтует всегда, поэтому для этого workflow нужен не Re-run,
          # а новый запуск (Run workflow).
          git fetch origin "${{ github.ref_name }}"
          # --autostash: rebase отказывается работать при любых незакоммиченных
          # изменениях в рабочей копии, и шаг тогда молча выбрасывал бы снимок
          # и журнал сигналов. Так уже было, когда в репозитории лежали .pyc.
          if git rebase --autostash "origin/${{ github.ref_name }}"; then
            git push && echo "снимок сохранён"
          else
            git rebase --abort || true
            git reset --hard "origin/${{ github.ref_name }}"
            echo "! снимок пропущен: в origin уже есть более свежий коммит"
          fi

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/last.json
            data/out/longshots_state.json
          key: pulse-${{ github.run_id }}

  # Будильник: через 55 минут после прогона запускает следующий.
  #
  # Задание привязано к окружению wait-55-min с таймером ожидания 55 минут.
  # Пока таймер идёт, задание не занимает машину и не тратит минуты; потом
  # запускает этот же workflow. Прогон (~3 мин) + ожидание (55) = примерно час.
  # Запуск встроенным токеном разрешён именно для workflow_dispatch: другие
  # события от него новых прогонов не создают.
  #
  # Чтобы остановить цепочку, достаточно отменить прогон, пока будильник ждёт
  # (Cancel workflow): отменённый прогон следующий не заводит.
  next:
    needs: pulse
    if: ${{ always() && !cancelled() }}   # и после неудачного прогона: один сбой
                                          # не должен обрывать часовой шаг
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: wait-55-min
    permissions:
      actions: write      # посмотреть список прогонов и запустить следующий
    steps:
      - name: Запустить следующий прогон
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          created=$(gh run view "$RUN_ID" -R "$REPO" --json createdAt -q .createdAt)
          waited=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "с начала прогона прошло $(( waited / 60 )) мин"

          # Предохранитель 1. Если окружения нет или у него не задан таймер,
          # задание стартует сразу, и прогоны пошли бы друг за другом без пауз.
          # Поэтому без 45 минут ожидания следующий прогон не запускается.
          if [ "$waited" -lt 2700 ]; then
            echo "! таймер окружения wait-55-min не сработал — следующий прогон не запускаю."
            echo "  Settings -> Environments -> wait-55-min -> Wait timer: 55"
            exit 0
          fi

          # Предохранитель 2. Будильник ставит каждый прогон: и свой, и по
          # расписанию, и ручной. Срабатывает только будильник самого свежего
          # прогона, иначе каждая лишняя цепочка добавляла бы по прогону в час.
          newest=$(gh run list -R "$REPO" --workflow pulse.yml --limit 1 \
                     --json databaseId -q '.[0].databaseId')
          if [ "$newest" != "$RUN_ID" ]; then
            echo "после этого прогона уже начался другой ($newest) — его будильник главнее"
            exit 0
          fi

          gh workflow run pulse.yml -R "$REPO" --ref "$REF"
          echo "следующий прогон запущен"
